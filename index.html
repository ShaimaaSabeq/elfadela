<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elfadela Institute</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F8F6; --surface:#FFFFFF; --ink:#17312B; --muted:#56706A;
  --line:#DCE7E2; --primary:#0F6B57; --primary-soft:#E3F1EC; --gold:#C9A24B;
  --hero:#0F6B57; --on-hero:#FFFFFF; --on-hero-muted:#CFE6DE;
  --sidebar-w:264px;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1A17; --surface:#15231F; --ink:#E4EEEA; --muted:#9DB3AB;
    --line:#253731; --primary:#5CC4A6; --primary-soft:#1A3A31; --gold:#D8B565;
    --hero:#134A3E; --on-hero:#F2F8F5; --on-hero-muted:#A9CFC2;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1A17; --surface:#15231F; --ink:#E4EEEA; --muted:#9DB3AB;
  --line:#253731; --primary:#5CC4A6; --primary-soft:#1A3A31; --gold:#D8B565;
  --hero:#134A3E; --on-hero:#F2F8F5; --on-hero-muted:#A9CFC2;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans Arabic","Noto Sans Arabic","Segoe UI",Tahoma,sans-serif;
  font-size:16px;line-height:1.7;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px}

.topbar{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:5;
  display:flex;align-items:center;gap:12px;
  height:56px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--line);
}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;background:none;border:0;border-radius:8px;cursor:pointer}
.icon-btn:hover{background:var(--primary-soft)}
.brand{font-family:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;font-weight:700;font-size:19px;color:var(--primary);line-height:1.3}

.sidebar{
  position:fixed;top:0;bottom:0;inset-inline-start:0;z-index:20;width:var(--sidebar-w);
  background:var(--surface);border-inline-end:1px solid var(--line);
  padding:calc(env(safe-area-inset-top,0px) + 12px) 12px calc(env(safe-area-inset-bottom,0px) + 12px);
  display:flex;flex-direction:column;overflow-y:auto;
  transform:translateX(-100%);transition:transform .22s ease;
}
[dir="rtl"] .sidebar{transform:translateX(100%)}
.sidebar.open,[dir="rtl"] .sidebar.open{transform:translateX(0)}
.sidebar-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 8px 16px;border-bottom:1px solid var(--line);margin-bottom:12px}
.nav{list-style:none;margin:0;padding:0}
.nav a{
  display:flex;align-items:center;gap:12px;width:100%;
  padding:10px 14px;border-radius:999px;margin-bottom:2px;
  color:var(--ink);text-decoration:none;font-size:16px;
}
.nav a:hover{background:var(--primary-soft)}
.nav a[aria-current="page"]{background:var(--primary-soft);color:var(--primary);font-weight:600}
.nav svg{flex:none}
.section-label{font-size:13px;color:var(--muted);padding:14px 14px 4px;font-weight:500}
.dot{width:8px;height:8px;border-radius:50%;background:var(--gold);flex:none;margin-inline:6px}
.nav a[aria-current="page"] .dot{background:var(--primary)}

.lang{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);display:flex;gap:4px;background:none}
.lang-switch{display:flex;width:100%;background:var(--primary-soft);border-radius:999px;padding:4px}
.lang-switch button{flex:1;border:0;background:none;border-radius:999px;padding:6px 10px;cursor:pointer;font-size:14px;color:var(--muted)}
.lang-switch button[aria-pressed="true"]{background:var(--surface);color:var(--primary);font-weight:600}

.scrim{position:fixed;inset:0;z-index:15;background:rgba(10,20,18,.4);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.show{opacity:1;pointer-events:auto}

main{padding:32px 20px;max-width:880px}
.greeting{background:var(--hero);color:var(--on-hero);border-radius:20px;padding:32px 28px}
.greeting h1{
  font-family:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;
  font-weight:500;font-size:clamp(1.9rem,6vw,3rem);line-height:1.4;margin:0;color:var(--on-hero);
}
.greeting .rule{width:56px;height:3px;background:var(--gold);border-radius:2px;margin:16px 0 12px}
.greeting p{margin:0;color:var(--on-hero-muted);font-size:17px}
.empty h1{font-size:24px;margin:8px 0 6px;font-weight:600}
.empty p{color:var(--muted);margin:0}

.page-head{margin-bottom:20px}
.page-head h1{font-family:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;font-weight:500;font-size:30px;line-height:1.4;margin:0;color:var(--primary)}
.page-head p{margin:2px 0 0;color:var(--muted)}
.page-head .rule{width:40px;height:3px;background:var(--gold);border-radius:2px;margin-top:10px}
.chapters{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.chapters a{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;color:var(--ink);text-decoration:none;transition:border-color .15s}
.chapters a:hover{border-color:var(--primary)}
:root{--soon-bg:transparent;--soon-line:#DCE7E2;--soon-ink:#56706A;--soon-num-bg:#EDF1EF;--soon-num-ink:#56706A;--soon-badge-bg:transparent;--soon-badge-ink:#56706A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--soon-bg:transparent;--soon-line:#253731;--soon-ink:#8FA49D;--soon-num-bg:#1C2A26;--soon-num-ink:#7F948D;--soon-badge-bg:transparent;--soon-badge-ink:#8FA49D}}
:root[data-theme="dark"]{--soon-bg:transparent;--soon-line:#253731;--soon-ink:#8FA49D;--soon-num-bg:#1C2A26;--soon-num-ink:#7F948D;--soon-badge-bg:transparent;--soon-badge-ink:#8FA49D}
.chapters .locked{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--soon-bg);border:1px solid var(--soon-line);border-radius:14px;color:var(--soon-ink);cursor:default}
.locked .num{background:var(--soon-num-bg);color:var(--soon-num-ink)}
.badge{flex:none;font-size:13px;font-weight:400;padding:2px 12px;border-radius:999px;border:1px solid var(--soon-line);background:var(--soon-badge-bg);color:var(--soon-badge-ink);white-space:nowrap}
.num{width:34px;height:34px;flex:none;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;font-weight:600;font-size:15px}
.ch-title{flex:1;font-weight:500;font-size:17px}
.chev{color:var(--muted);flex:none}
[dir="rtl"] .flip{transform:scaleX(-1)}
.crumb{display:inline-flex;align-items:center;gap:6px;color:var(--primary);text-decoration:none;font-size:15px;margin-bottom:12px}
.crumb:hover{text-decoration:underline}
.rec-list{display:grid;gap:12px}
.rec-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 20px}
.rec-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.rec-icon{width:42px;height:42px;border-radius:50%;background:var(--hero);color:var(--on-hero);display:grid;place-items:center;flex:none}
.rec-title{font-weight:600;font-size:17px;line-height:1.4}
.rec-meta{color:var(--muted);font-size:14px}
.rec-card audio{width:100%;display:block}
.rec-icon{position:relative}
.rec-card.is-loading .rec-icon::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid transparent;border-top-color:var(--gold);border-right-color:var(--gold);animation:spin .8s linear infinite}
.rec-meta{display:flex;align-items:center;gap:8px;min-height:1.5em;white-space:nowrap}
.rec-card.is-loading .rec-meta{color:var(--primary)}
.rec-card.is-error .rec-meta{color:#B3261E}
:root[data-theme="dark"] .rec-card.is-error .rec-meta{color:#F2A49C}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .rec-card.is-error .rec-meta{color:#F2A49C}}
.rec-meta .retry{border:0;background:none;padding:0;color:inherit;text-decoration:underline;cursor:pointer;font-size:14px;font-weight:600;line-height:inherit}
@media (prefers-reduced-motion:reduce){.rec-card.is-loading .rec-icon::after{animation-duration:2s}}
.spin{width:16px;height:16px;flex:none;border:2px solid var(--line);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2s}}
.quiz-card{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 20px}
.quiz-card .rec-head{flex-wrap:wrap}
.quiz-icon{background:var(--primary-soft) !important;color:var(--primary) !important}
.best{color:var(--primary);font-weight:500}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:8px 20px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;cursor:pointer;font-size:15px;font-weight:500}
.btn:hover{border-color:var(--primary)}
.btn.primary{background:var(--hero);border-color:var(--hero);color:var(--on-hero)}
.btn.primary:hover{filter:brightness(1.08)}
.q-progress{display:grid;gap:8px;margin-bottom:14px;color:var(--muted);font-size:14px}
.bar{height:6px;background:var(--line);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--primary);border-radius:999px;transition:width .2s}
.q-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 20px}
.q-text{font-family:"IBM Plex Sans Arabic","Noto Sans Arabic",Tahoma,sans-serif;font-weight:600;font-size:24px;line-height:1.5;margin:0 0 18px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:start;padding:14px 16px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer;font-size:17px;line-height:1.5}
.opt:hover{border-color:var(--primary)}
.opt .radio{width:20px;height:20px;flex:none;border-radius:50%;border:2px solid var(--line)}
.opt.sel{border-color:var(--primary);background:var(--primary-soft)}
.opt.sel .radio{border-color:var(--primary);background:var(--primary);box-shadow:inset 0 0 0 4px var(--primary-soft)}
.q-err{min-height:1.5em;margin:10px 0 0;color:#B3261E;font-size:14px}
.quiz-nav{display:flex;justify-content:space-between;gap:12px;margin-top:16px}
.score-card{background:var(--hero);color:var(--on-hero);border-radius:20px;padding:28px;text-align:center}
.score{font-family:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;font-size:46px;line-height:1.2}
.score-pct{color:var(--on-hero-muted);font-size:17px;margin-top:4px}
.rv-title{font-size:18px;margin:24px 0 10px;font-weight:600}
.rv-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.rv{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.rv-q{font-weight:500;display:flex;gap:8px}
.rv-mark{flex:none;font-weight:700}
.rv.ok .rv-mark{color:var(--primary)}
.rv.no .rv-mark{color:#B3261E}
.rv-a{color:var(--muted);font-size:15px;margin-top:2px}
.rv-a.wrong [lang]{text-decoration:line-through}
:root[data-theme="dark"] .q-err,:root[data-theme="dark"] .rv.no .rv-mark{color:#F2A49C}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .q-err,:root:not([data-theme="light"]) .rv.no .rv-mark{color:#F2A49C}}
.q-card{position:relative}
:root{--ok:#1E7F4F;--ok-bg:#E4F3EA;--bad:#B3261E;--bad-bg:#FBE9E7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ok:#6FD3A0;--ok-bg:#163527;--bad:#F2A49C;--bad-bg:#3A1F1C}}
:root[data-theme="dark"]{--ok:#6FD3A0;--ok-bg:#163527;--bad:#F2A49C;--bad-bg:#3A1F1C}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.right .radio{border-color:var(--ok);background:var(--ok);box-shadow:inset 0 0 0 4px var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);animation:shake .4s}
.opt.wrong .radio{border-color:var(--bad);background:var(--bad);box-shadow:inset 0 0 0 4px var(--bad-bg)}
.opt.right.picked{animation:pop .35s}
.opt.dim{opacity:.5}
.opt[aria-disabled="true"]{cursor:default}
.opt[aria-disabled="true"]:hover{border-color:inherit}
.opt.right[aria-disabled="true"]:hover{border-color:var(--ok)}
.opt.wrong[aria-disabled="true"]:hover{border-color:var(--bad)}
.opt.dim:hover{border-color:var(--line)}
.q-feedback{min-height:1.7em;margin:14px 0 0;font-weight:600;font-size:18px}
.q-feedback.ok{color:var(--ok)}
.q-feedback.bad{color:var(--bad)}
.confetti{position:absolute;inset:0;pointer-events:none}
.confetti i{position:absolute;left:var(--x);top:var(--y);width:8px;height:12px;border-radius:2px;animation:conf 1.1s ease-out forwards}
@keyframes conf{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pop{50%{transform:scale(1.03)}}
@media (prefers-reduced-motion:reduce){.opt.wrong,.opt.right.picked{animation:none}.confetti{display:none}}
.opt{transition:background-color .28s ease,border-color .28s ease,opacity .35s ease,transform .15s ease}
.opt:active:not([aria-disabled="true"]){transform:scale(.98)}
.opt .radio{transition:background-color .28s ease,border-color .28s ease,box-shadow .28s ease}
.bar i{transition:width .5s cubic-bezier(.2,.7,.2,1)}
.q-feedback.ok,.q-feedback.bad{animation:fbIn .3s ease-out}
@keyframes fbIn{from{opacity:0;transform:translateY(6px)}}
.q-card.enter{animation:cardIn .38s cubic-bezier(.2,.7,.2,1)}
[dir="rtl"] .q-card.enter{animation-name:cardInRtl}
.q-card.leave{animation:cardOut .26s ease-in forwards}
[dir="rtl"] .q-card.leave{animation-name:cardOutRtl}
@keyframes cardIn{from{opacity:0;transform:translateX(32px)}}
@keyframes cardInRtl{from{opacity:0;transform:translateX(-32px)}}
@keyframes cardOut{to{opacity:0;transform:translateX(-32px)}}
@keyframes cardOutRtl{to{opacity:0;transform:translateX(32px)}}
.q-card.enter .q-text{animation:riseIn .35s ease-out both}
.q-card.enter .opt{animation:riseIn .35s ease-out both}
.q-card.enter .opt:nth-child(1){animation-delay:.08s}
.q-card.enter .opt:nth-child(2){animation-delay:.14s}
.q-card.enter .opt:nth-child(3){animation-delay:.2s}
.q-card.enter .opt:nth-child(4){animation-delay:.26s}
.q-card.enter .opt:nth-child(5){animation-delay:.32s}
@keyframes riseIn{from{opacity:0;transform:translateY(10px)}}
.score-card{animation:riseIn .4s ease-out both}
.rv-title,.rv-list{animation:riseIn .4s ease-out .12s both}
@media (prefers-reduced-motion:reduce){.q-card.enter,.q-card.enter .q-text,.q-card.enter .opt,.q-card.leave,.q-feedback.ok,.q-feedback.bad,.score-card,.rv-title,.rv-list{animation:none}.bar i,.opt,.opt .radio{transition:none}}
.book{display:flex;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:20px}
.book img{width:78px;height:auto;border-radius:6px;box-shadow:0 4px 12px rgba(0,0,0,.14);flex:none}
.book-info{flex:1;min-width:0}
.book-label{font-size:13px;color:var(--muted);font-weight:500}
.book-title{font-weight:600;font-size:17px;line-height:1.5}
.book-meta{color:var(--muted);font-size:14px}
.book-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn.sm{min-height:36px;padding:6px 18px;font-size:14px;min-width:96px}
.btn[disabled]{opacity:.75;cursor:progress}
.reader-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px;color:var(--muted);font-size:14px}
.pages{display:grid;gap:12px;max-width:820px}
.page{position:relative;background:#FFFFFF;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.page canvas{display:block;width:100%;height:100%}
.page .pn{position:absolute;bottom:6px;inset-inline-end:10px;font-size:12px;color:#56706A;background:rgba(255,255,255,.88);padding:0 8px;border-radius:999px}
.reader-msg{display:flex;align-items:center;gap:10px;color:var(--muted);margin:8px 0}
.seg{display:flex;max-width:440px;background:var(--primary-soft);border-radius:999px;padding:4px;margin:0 0 16px}
.seg button{flex:1;border:0;background:none;border-radius:999px;padding:8px 12px;cursor:pointer;color:var(--muted);font-size:15px;transition:background-color .2s,color .2s}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--primary);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.res-list{animation:riseIn .3s ease-out both}
.res-list .book:last-child{margin-bottom:0}
.res-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;animation:riseIn .3s ease-out both}
.res-tile{display:flex;flex-direction:column;gap:2px;background:var(--primary-soft);border-radius:16px;padding:16px}
.res-ico{color:var(--primary);margin-bottom:4px}
.res-kind{font-size:13px;color:var(--muted);font-weight:500}
.res-title{font-weight:600;font-size:16px;line-height:1.5}
.res-meta{font-size:13px;color:var(--muted)}
.res-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
@media (prefers-reduced-motion:reduce){.res-grid{animation:none}.seg button{transition:none}}
.pg-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:8px}
.pg-stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.pg-stat b{display:block;font-family:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;font-weight:500;font-size:24px;line-height:1.3;color:var(--primary)}
.pg-stat span{display:block;font-size:13px;line-height:1.4;color:var(--muted)}
.pg-title{font-size:17px;font-weight:600;margin:22px 0 8px}
.pg-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin-bottom:10px}
.pg-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:8px}
.pg-head h3{margin:0;font-size:18px;font-weight:600}
.pg-head span{font-size:14px;color:var(--muted);white-space:nowrap}
.pg-sub{font-size:14px;font-weight:500;color:var(--muted);margin:14px 0 2px}
.pg-list{list-style:none;margin:0;padding:0}
.pg-q{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.pg-q:first-child{border-top:0}
.pg-score{font-weight:600;color:var(--primary);white-space:nowrap}
.pg-score.low{color:#B3261E}
:root[data-theme="dark"] .pg-score.low{color:#F2A49C}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pg-score.low{color:#F2A49C}}
.pg-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pg-row .t{flex:1;min-width:0}
.pg-row .t b{display:block;font-weight:600;line-height:1.5}
.pg-row .t span{font-size:14px;color:var(--muted)}
.pg-empty{color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:16px;margin:0}
.pg-reset{margin-top:24px}
@media (max-width:480px){
  .pg-stats{grid-template-columns:1fr 1fr}
  .pg-stats .pg-stat:last-child{grid-column:1 / -1}
  .pg-row .btn{width:100%}
  .pg-card{padding:14px}
}
.nav-soon{margin-inline-start:auto;font-size:12px;padding:1px 10px}
.skip{position:absolute;inset-inline-start:12px;top:-60px;z-index:50;background:var(--hero);color:var(--on-hero);padding:10px 16px;border-radius:999px;text-decoration:none;font-weight:600}
.skip:focus{top:calc(env(safe-area-inset-top,0px) + 8px)}
@media (max-width:899px){
  .sidebar{visibility:hidden;transition:transform .22s ease,visibility 0s linear .22s}
  .sidebar.open{visibility:visible;transition:transform .22s ease,visibility 0s}
  .btn,.btn.sm{min-height:44px}
  .seg button{min-height:44px}
  .lang-switch button{min-height:40px}
  .crumb{min-height:44px;margin-bottom:4px}
  .icon-btn{width:44px;height:44px}
  main{padding:24px 16px}
  .page-head h1{font-size:26px}
  .q-text{font-size:21px}
  .book{flex-wrap:wrap}
}
@media (min-width:900px){
  .topbar,.scrim,.close-btn{display:none}
  .sidebar,[dir="rtl"] .sidebar{transform:none;transition:none}
  main{margin-inline-start:var(--sidebar-w);padding:56px 48px}
}
@media (prefers-reduced-motion:reduce){.sidebar,.scrim{transition:none}}

/* First-visit "What's your name?" screen (full-screen welcome) */
.welcome{
  position:fixed;inset:0;z-index:40;overflow-y:auto;
  display:flex;flex-direction:column;
  background:var(--hero);color:var(--on-hero);
  padding:calc(env(safe-area-inset-top,0px) + 12px) 20px calc(env(safe-area-inset-bottom,0px) + 28px);
}
.welcome[hidden]{display:none}
body.no-scroll{overflow:hidden}
.welcome-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px}
.welcome .brand{color:var(--on-hero)}
.welcome .lang-switch{width:auto;background:rgba(255,255,255,.14)}
.welcome .lang-switch button{min-height:44px;min-width:44px;padding:6px 14px;color:var(--on-hero)}
.welcome .lang-switch button[aria-pressed="true"]{background:var(--surface);color:var(--primary)}
.welcome-body{width:100%;max-width:440px;align-self:center;margin-top:auto;padding-top:40px}
@media (min-width:900px){.welcome-body{margin-block:auto}}
.welcome h1{font-family:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;font-weight:500;font-size:32px;line-height:1.35;margin:0}
.welcome .rule{width:56px;height:3px;background:var(--gold);border-radius:2px;margin:16px 0 12px}
.welcome-sub{margin:0 0 28px;color:var(--on-hero-muted);font-size:17px}
.welcome label{display:block;font-weight:600;font-size:17px;margin-bottom:8px}
.welcome input{
  display:block;width:100%;min-height:48px;padding:10px 14px;
  font:inherit;font-size:16px;color:var(--ink);background:var(--surface);
  border:2px solid transparent;border-radius:12px;
}
.welcome input::placeholder{color:var(--muted)}
[dir="rtl"] .welcome input:placeholder-shown{direction:rtl;text-align:right}
.welcome input[aria-invalid="true"]{border-color:#D93025}
.welcome-err{margin:10px 0 0;padding:8px 12px;border-radius:10px;background:#FDECEA;color:#B3261E;font-size:15px;font-weight:600}
.welcome-err:empty{display:none}
.welcome-go{display:block;width:100%;min-height:48px;margin-top:20px;border:0;border-radius:12px;background:var(--gold);color:#17312B;font-weight:600;font-size:17px;cursor:pointer}
.welcome-go:hover{filter:brightness(1.05)}
.welcome-cancel{display:block;margin:12px auto 0;min-height:44px;padding:0 16px;background:none;border:0;color:var(--on-hero);text-decoration:underline;cursor:pointer}
.welcome-cancel[hidden]{display:none}
.welcome :focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@keyframes welcomeIn{from{opacity:0;transform:translateY(12px)}}
.welcome:not([hidden]) .welcome-body{animation:welcomeIn .35s ease}
@media (prefers-reduced-motion:reduce){.welcome:not([hidden]) .welcome-body{animation:none}}
.lang{flex-direction:column}
.change-name{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:8px 14px;border:0;background:none;border-radius:999px;color:var(--primary);font-size:15px;cursor:pointer;text-align:start}
.change-name:hover{background:var(--primary-soft)}
.change-name[hidden]{display:none}
</style>
</head>

    else { delete nameErr.dataset.t; nameErr.textContent = ""; nameInput.removeAttribute("aria-invalid"); }
  }
  function openNameScreen(isChange){
    nameIsChange = !!isChange;
    nameCancel.hidden = !nameIsChange;
    nameInput.value = nameIsChange ? getStudentName() : "";
    showNameError("");
    nameBehind.forEach(function(el){ if (el) el.setAttribute("inert", ""); });
    document.body.classList.add("no-scroll");
    nameScreen.hidden = false;
    setTimeout(function(){ nameInput.focus(); }, 50);
  }
  function closeNameScreen(){
    nameScreen.hidden = true;
    nameBehind.forEach(function(el){ if (el) el.removeAttribute("inert"); });
    document.body.classList.remove("no-scroll");
    (nameIsChange ? openBtn : main).focus();
  }
  nameForm.addEventListener("submit", function(e){
    e.preventDefault();
    var n = cleanName(nameInput.value);
    var err = nameError(n);
    if (err){ showNameError(err); nameInput.focus(); return; }
    setStudentName(n);
    closeNameScreen();
  });
  nameInput.addEventListener("input", function(){ if (nameErr.textContent && !nameError(cleanName(nameInput.value))) showNameError(""); });
  nameCancel.addEventListener("click", closeNameScreen);
  document.addEventListener("keydown", function(e){ if (e.key === "Escape" && !nameScreen.hidden && nameIsChange) closeNameScreen(); });
  changeNameBtn.hidden = !student.canSave;
  changeNameBtn.addEventListener("click", function(){ closeMenu(); openNameScreen(true); });

  applyLang(); render();
  if (student.canSave && !getStudentName()) openNameScreen(false);
})();
</script>
</body>
</html>
